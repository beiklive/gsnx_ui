# 用 GitHub 的 macOS runner 打 iOS 的 .ipa（runner 自带 Xcode，本机没装 Xcode 也能出包）。
#
# 触发方式：
#   * 手动：Actions → 左侧 “iOS IPA” → Run workflow（可填目标名 / 配置 / 是否 ad-hoc 签名）
#   * 自动：往 main 推 iOS 相关文件（本 workflow、scripts/build_ios_ipa.sh、iOS 工具链 / Info.plist）
#
# 产物：Actions 页面该次运行的 Artifacts → ios-ipa-<目标>/<目标>.ipa（未签名，安装前需重签：
#       AltStore / Sideloadly / TrollStore / zsign；选 adhoc 的话可直接装到越狱/TrollStore 设备）。
name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "要打包的目标（gui_dev_demo / gui_dev_min_demo / ...）"
        default: "gui_dev_demo"
        required: true
      config:
        description: "构建配置"
        type: choice
        options: ["Release", "Debug"]
        default: "Release"
      sign:
        description: "签名方式（adhoc = codesign -s -，越狱/TrollStore 可直接装）"
        type: choice
        options: ["none", "adhoc"]
        default: "none"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "scripts/build_ios_ipa.sh"
      - "cmake/toolchains/iOS.cmake"
      - "cmake/Info.plist.in"

jobs:
  ipa:
    name: 构建 .ipa
    runs-on: macos-15
    timeout-minutes: 60
    # 失败时把构建日志推到 ci-logs 分支（这样不用权限也能看到日志，方便无人值守排查）
    permissions:
      contents: write
    steps:
      - name: 取代码（含 imgui 子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 环境信息（Xcode / SDK / CMake）
        run: |
          set -x
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version | head -1

      - name: 构建并打包 IPA
        env:
          TARGET: ${{ inputs.target || 'gui_dev_demo' }}
          CONFIG_NAME: ${{ inputs.config || 'Release' }}
          SIGN_KIND: ${{ inputs.sign || 'none' }}
        run: |
          set -uo pipefail
          chmod +x scripts/build_ios_ipa.sh
          args=(--target "${TARGET}" --config "${CONFIG_NAME}" --out dist/ios)
          if [ "${SIGN_KIND}" = "adhoc" ]; then args+=(--adhoc); fi
          scripts/build_ios_ipa.sh "${args[@]}" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            # 把关键行发成 action 注解（注解匿名可读），并且日志会在最后一步推到 ci-logs 分支
            echo "::error title=iOS 构建失败::脚本退出码 ${rc}"
            grep -i -E "error|failed|失败|找不到|cannot|undefined reference|no such file" /tmp/build.log \
              | tail -20 | while IFS= read -r line; do echo "::error title=ios-build::${line}"; done
            echo "=== 日志尾部 ==="
            tail -40 /tmp/build.log
            exit "${rc}"
          fi
          echo "--- dist/ios ---"
          ls -la dist/ios || true

      - name: 上传 IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.target || 'gui_dev_demo' }}
          path: dist/ios/*.ipa
          if-no-files-found: warn

      - name: 失败时上传构建目录里的日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/ios/**/*.log
            build/ios/CMakeCache.txt
          if-no-files-found: ignore

      - name: 失败时把日志推到 ci-logs 分支（无权限也能读）
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-log
          # 只保留尾部，别把分支撑爆
          tail -c 300000 /tmp/build.log > "ci-log/build-run${GITHUB_RUN_NUMBER}.log" || true
          {
            echo "# iOS 构建日志（run ${GITHUB_RUN_NUMBER}，${GITHUB_SHA}）"
            echo
            echo "结论：失败。完整日志见 build-run${GITHUB_RUN_NUMBER}.log"
            echo
            echo '```'
            tail -60 /tmp/build.log || true
            echo '```'
          } > ci-log/README.md
          git add -f ci-log
          git commit -m "CI: iOS 构建日志 run #${GITHUB_RUN_NUMBER}（失败）" || true
          git push -f origin HEAD:ci-logs
