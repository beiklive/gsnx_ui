name: Platform builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ios:
    name: iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout (including ImGui submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package IPA
        run: |
          chmod +x scripts/build_ios_ipa.sh scripts/verify_ios_app.sh
          scripts/build_ios_ipa.sh --target gui_dev_demo --config Release --out dist/ios
          scripts/verify_ios_app.sh dist/ios/gui_dev_demo.ipa --github

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-demo-ipa
          path: dist/ios/gui_dev_demo.ipa
          if-no-files-found: error

  windows:
    name: Windows x64 demo
    runs-on: windows-latest
    steps:
      - name: Checkout (including ImGui submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build demo
        run: |
          cmake --preset windows
          cmake --build --preset windows --target gui_dev_demo --parallel

      - name: Upload demo executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-demo
          path: build/windows/Release/gui_dev_demo.exe
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (including ImGui submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` 已从 Android SDK 仓库移除；显式覆盖 action 默认值，避免
          # action 更新或 runner 镜像把废弃包名带进 sdkmanager。
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK (native target is demo only)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          cmake --preset android
          cmake --build --preset android --target main --parallel 2
          gradle --project-dir android --no-daemon :app:assembleRelease \
            -Psdl2SourceDir="$GITHUB_WORKSPACE/build/android/_deps/sdl2-src"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  linux:
    name: Linux x64 demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (including ImGui submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL2 and libpng
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsdl2-dev libpng-dev pkg-config

      - name: Configure and build demo
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DGUI_DEV_PLATFORM=linux \
            -DGUI_DEV_BACKEND=sdl2 \
            -DGUI_DEV_DEPS_MODE=package \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --target gui_dev_demo --parallel 2

      - name: Upload demo executable
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-demo
          path: build/linux/gui_dev_demo
          if-no-files-found: error

  switch:
    name: Nintendo Switch NRO
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (including ImGui submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build demo
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            devkitpro/devkita64:20260219 \
            bash -lc 'set -euo pipefail; cmake --preset switch; cmake --build --preset switch --parallel 2'

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-demo
          path: build/switch/dist/gui_dev_demo.nro
          if-no-files-found: error
